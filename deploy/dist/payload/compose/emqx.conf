# EMQX 5.x 生产配置：HTTP 认证/授权回调平台后端（经容器网络 http://server:8080）
node {
  name = "emqx@emqx"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

# 所有设备连接经平台后端鉴权（设备三元组 / 动态 Token）
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://server:8080/api/v1/emqx/auth"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    headers {
      "content-type" = "application/json"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

# Topic 级权限由平台后端控制：设备只能发自己的 up、订自己的 down/广播；未命中一律拒绝
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      method = post
      url = "http://server:8080/api/v1/emqx/acl"
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
      }
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}

# 开启客户端上下线事件推送到 $SYS 主题，由平台后端订阅
sys_topics {
  sys_msg_interval = "1m"
  sys_heartbeat_interval = "30s"
  sys_event_messages {
    client_connected = true
    client_disconnected = true
    client_subscribed = false
    client_unsubscribed = false
  }
}
