# KK物联云 生产部署 —— 全 Docker Compose（Linux x86_64，IP 访问）
#
# 用法：bash setup.sh  →  docker compose up -d --build
# 暴露端口：80(web) / 1883(MQTT) / 9100(DTU)  ；  18083(EMQX Dashboard) 仅绑 127.0.0.1
# 不暴露：8080(后端) / 5432(数据库) / 6379(Redis) —— 仅内部网络

networks:
  iot-net:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  emqx-data:
  uploads:

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-postgres
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iot
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [iot-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [iot-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    container_name: iot-emqx
    environment:
      EMQX_NODE__NAME: "emqx@emqx"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - emqx-data:/opt/emqx/data
    ports:
      - "1883:1883"       # MQTT 设备接入
      - "8083:8083"       # MQTT over WebSocket（可选）
      - "127.0.0.1:18083:18083"   # Dashboard 仅本机（SSH 隧道访问）
    networks: [iot-net]
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: iot-server
    volumes:
      - ./config.prod.yaml:/app/configs/config.yaml:ro
      - uploads:/app/uploads
    ports:
      - "9100:9100"       # TCP 透传网关（DTU 设备）
    networks: [iot-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    container_name: iot-web
    ports:
      - "80:80"           # 管理后台（nginx 反代 /api 到 server:8080）
    networks: [iot-net]
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
