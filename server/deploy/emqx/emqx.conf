# EMQX 5.x 配置：HTTP 认证对接平台后端 + 开启上下线系统事件
node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

# 所有设备连接经平台后端鉴权（设备三元组）
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://127.0.0.1:8080/api/v1/emqx/auth"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    headers {
      "content-type" = "application/json"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

# MVP 阶段放开 ACL（鉴权已由平台控制），后续按主题收紧
authorization {
  no_match = allow
  deny_action = ignore
  sources = []
}

# 开启客户端上下线事件推送到 $SYS 主题，由平台后端订阅
sys_topics {
  sys_msg_interval = "1m"
  sys_heartbeat_interval = "30s"
  sys_event_messages {
    client_connected = true
    client_disconnected = true
    client_subscribed = false
    client_unsubscribed = false
  }
}
