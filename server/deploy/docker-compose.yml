services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iot-postgres
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot123456
      POSTGRES_DB: iot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    container_name: iot-emqx
    # host 网络：EMQX 直接使用 WSL 主机网络栈（镜像网络模式下与 Windows localhost 互通）
    # 端口: 1883 MQTT / 8083 WS / 18083 Dashboard(admin/public)
    network_mode: host
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf
      - emqx-data:/opt/emqx/data
    restart: unless-stopped

volumes:
  pgdata:
  emqx-data:
