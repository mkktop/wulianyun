server:
  addr: ":8080"

# TCP 透传网关（DTU 接入）
gateway:
  addr: ":9100"
  # 空闲超时(秒)，超时无数据则断开并置为离线
  idle_timeout: 300
  max_conns_per_ip: 10
  conn_rate_limit: 5
  conn_rate_burst: 10
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

jwt:
  secret: "iot-platform-jwt-secret-change-me"
  expire_hours: 72

database:
  dsn: "host=127.0.0.1 user=iot password=iot123456 dbname=iot port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1800
  conn_max_idle_time: 600
  retention_days: 30
  compress_after_days: 7

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5

mqtt:
  broker: "tcp://127.0.0.1:1883"
  client_id: "iot-platform-internal"
  # 平台内部账号，EMQX 鉴权回调中放行
  username: "iot-platform-internal"
  password: "internal-secret-2026"
  tls:
    enabled: false
    ca_cert: ""
    client_cert: ""
    client_key: ""
    insecure_skip_verify: true

telemetry_buffer:
  max_batch: 100
  flush_interval: 1

cache:
  device_ttl: 300
  shadow_flush_interval: 5

poller:
  max_concurrent: 50

log:
  trace_retention_days: 7
  device_log_retention_days: 30
