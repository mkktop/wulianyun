# KK物联云 前端 Nginx：静态资源 + 反向代理后端
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;   # OTA 固件上传

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket 路由 —— 精确匹配优先于 /api/，需 Upgrade 头
    location = /api/v1/ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /api/v1/mqtt-debug/ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST API —— proxy_pass 无尾斜杠，保留完整 URI（含 ?token= 查询串）
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OTA 固件下载 —— 需后端 router.Static("/uploads","./uploads")
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    # 开发者文档（VitePress 静态站，base=/developer/，cleanUrls 用 .html 兜底）
    location /developer/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # SPA history 模式兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
